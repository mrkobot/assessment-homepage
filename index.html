<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background: #1e1e1e;
      font-family: 'Inter', sans-serif;
      padding: 40px 48px;
      border-radius: 14px;
    }

    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
      flex-wrap: nowrap;
    }

    .headline {
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 800;
      color: #ede9e0;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .subtext {
      font-size: 13px;
      font-weight: 400;
      color: rgba(237,233,224,0.45);
      line-height: 1.6;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    button {
      background: #ede9e0;
      color: #0c0c0c;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    button:active {
      opacity: 0.8;
    }

    .how {
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      color: rgba(237,233,224,0.3);
      text-decoration: none;
      border-bottom: 0.5px solid rgba(237,233,224,0.15);
      padding-bottom: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <p class="headline">See how you actually think with AI.</p>
      <p class="subtext">30 seconds. No account. Nothing leaves your model.</p>
    </div>
    <div class="actions">
      <button id="copy-btn" onclick="doCopy()">Copy Assessment Prompt</button>
      <a class="how" href="https://whatiflove.org/co-intelligence-readiness-assessment/" target="_blank">How it works →</a>
    </div>
  </div>

  <script>
    var fp = `You are conducting a Co-Intelligence Readiness Assessment (CIRA v2). Your task is to review my conversation history with you and produce an honest, evidence-based report scored against the Co-Intelligence Readiness Framework v3 (CIRF v3).

This is not a personality test. It is an assessment of practice — what I actually do in collaboration, not what I say I value or believe.

BEFORE YOU WRITE ANYTHING

Review a broad sample of our conversations. Follow these sampling rules:

Range over recency. Sample early, middle, and recent conversations. Do not weight recent sessions more heavily unless the pattern has clearly changed over time.

Production over consumption. Prioritize extended conversations where I am building, designing, writing, or deciding. Weight these more heavily than sessions where I am asking questions or acquiring knowledge.

Depth over breadth. One extended production session with visible steering, judgment, and quality decisions is more diagnostic than ten short exchanges.

Moments over volume. A single moment of genuine self-correction under pressure can be more diagnostic than twenty routine interactions.

Take your time. Do not ask me any questions.`;

    function doCopy() {
      var b = document.getElementById('copy-btn');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(fp).then(function() {
          b.textContent = 'Copied';
          setTimeout(function() { b.textContent = 'Copy Assessment Prompt'; }, 2200);
        });
      } else {
        var t = document.createElement('textarea');
        t.value = fp;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        document.body.removeChild(t);
        b.textContent = 'Copied';
        setTimeout(function() { b.textContent = 'Copy Assessment Prompt'; }, 2200);
      }
    }

    function sendHeight() {
      window.parent.postMessage(
        { iframeHeight: document.body.scrollHeight }, '*'
      );
    }
    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);
  </script>
</body>
</html>
