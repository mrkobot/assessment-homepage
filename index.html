<h2 class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Assessment CTA card — Syne font to match site</h2>

<div style="background:#0c0c0c;padding:2px 0;">

  <div style="background:#1e1e1e;border-radius:14px;padding:48px 52px;display:flex;justify-content:space-between;align-items:center;gap:40px;">
    <div>
      <p style="font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#ede9e0;margin:0 0 10px;line-height:1.2;letter-spacing:-0.01em;">See how you actually think with AI.</p>
      <p style="font-family:'Syne',sans-serif;font-size:14px;font-weight:400;color:rgba(237,233,224,0.45);margin:0;line-height:1.6;">30 seconds. No account. Nothing leaves your model.</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex-shrink:0;">
      <button id="copy-btn" onclick="doCopy()" style="background:#ede9e0;color:#0c0c0c;border:none;border-radius:8px;padding:13px 28px;font-size:13px;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:0.02em;">Copy Assessment Prompt</button>
      <a href="https://whatiflove.org/co-intelligence-readiness-assessment/" style="font-size:12px;font-family:'Syne',sans-serif;color:rgba(237,233,224,0.3);text-decoration:none;border-bottom:0.5px solid rgba(237,233,224,0.15);padding-bottom:1px;">How it works →</a>
    </div>
  </div>

</div>

<script>
var fp=`You are conducting a Co-Intelligence Readiness Assessment (CIRA v2). Your task is to review my conversation history with you and produce an honest, evidence-based report scored against the Co-Intelligence Readiness Framework v3 (CIRF v3).

This is not a personality test. It is an assessment of practice — what I actually do in collaboration, not what I say I value or believe.

BEFORE YOU WRITE ANYTHING

Review a broad sample of our conversations. Follow these sampling rules:

Range over recency. Sample early, middle, and recent conversations. Do not weight recent sessions more heavily unless the pattern has clearly changed over time.

Production over consumption. Prioritize extended conversations where I am building, designing, writing, or deciding. Weight these more heavily than sessions where I am asking questions or acquiring knowledge.

Depth over breadth. One extended production session with visible steering, judgment, and quality decisions is more diagnostic than ten short exchanges.

Moments over volume. A single moment of genuine self-correction under pressure can be more diagnostic than twenty routine interactions.

Take your time. Do not ask me any questions.`;
function doCopy(){var b=document.getElementById('copy-btn');if(navigator.clipboard){navigator.clipboard.writeText(fp).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy Assessment Prompt';},2200);});}else{var t=document.createElement('textarea');t.value=fp;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);b.textContent='Copied';setTimeout(function(){b.textContent='Copy Assessment Prompt';},2200);}}
</script>
